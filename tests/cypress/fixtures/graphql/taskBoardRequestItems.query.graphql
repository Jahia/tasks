query TaskBoardRequestItems($first: Int!, $limit: Int) {
    taskBoard(first: $first) {
        edges {
            node {
                id
                taskType
                title
                workflowSummary
                requestItemCount
                requestItems(limit: $limit) {
                    uuid
                    displayName
                    typeName
                    inPage
                    locationPath
                    previewUrl
                }
                targets {
                    uuid
                    displayName
                }
            }
        }
    }
}
