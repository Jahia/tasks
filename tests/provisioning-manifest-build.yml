- addMavenRepository: 'https://store.jahia.com/nexus/content/repositories/jahia-public-app-store@id=JahiaStore'
- addMavenRepository: 'https://devtools.jahia.com/nexus/content/groups/public/@snapshots@noreleases@id=JahiaSnapshot'

# EXPERIMENT ONLY -- do not merge. The jahia-ee-dev image now carries app-shell 4.0.0-SNAPSHOT,
# whose HTML5/standards-mode switch and forced @jahia/ui-extender 2.0.0 are the open suspects for
# the four task-ui failures. Pinning the last 3.x release turns that into an A/B: if those four
# pass here and fail on ci/restore-integration-test-harness, app-shell 4 is the variable.
- installBundle:
  - 'mvn:org.jahia.modules/app-shell/3.4.0'
  autoStart: true
  uninstallPreviousVersion: true

# The test suite creates its sites on dx-base-demo-templates (see tests/cypress/support/constants.ts) --
# graphql-dxm-provider is not listed here, it comes from this module's own jahia-depends header.
#
# The demo template set's own jahia-depends has to be listed too: provisioning installs exactly the
# bundles named here and does not pull a module's Jahia dependencies after it, so an unlisted one
# leaves the template set installed-but-not-started ("has unresolved dependency <x> and won't be
# started"). A site then cannot be created on it, which fails the before-all hook of every spec.
# Only the names missing from a stock Jahia are listed: default, search, facets and
# legacy-default-components are already there.
- installBundle:
  - 'mvn:org.jahia.modules/dx-base-demo-core'
  - 'mvn:org.jahia.modules/dx-base-demo-components'
  - 'mvn:org.jahia.modules/dx-base-demo-templates'
  - 'mvn:org.jahia.modules/bootstrap3-core'
  - 'mvn:org.jahia.modules/bootstrap3-components'
  - 'mvn:org.jahia.modules/font-awesome'
  - 'mvn:org.jahia.modules/skins'
  # bookmarks declares default-skins, which declares skins above: the closure runs two levels
  # deep, not one, which is why the first pass still left the template set unstarted.
  - 'mvn:org.jahia.modules/default-skins'
  - 'mvn:org.jahia.modules/bookmarks'
  - 'mvn:org.jahia.modules/topstories'
  - 'mvn:org.jahia.modules/calendar'
  - 'mvn:org.jahia.modules/rating'
  - 'mvn:org.jahia.modules/location'
  # news declares grid, the second of the two second-level dependencies.
  - 'mvn:org.jahia.modules/news'
  - 'mvn:org.jahia.modules/grid'
  - 'mvn:org.jahia.modules/event'
  - 'mvn:org.jahia.modules/person'
  autoStart: true
  uninstallPreviousVersion: true
